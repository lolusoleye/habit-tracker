<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .btn-primary {
            background-color: #1d1d1f;
            border-color: #1d1d1f;
            border-radius: 20px;
            padding: 8px 24px;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #3d3d3f;
            border-color: #3d3d3f;
        }
        .form-control {
            border-radius: 10px;
            padding: 10px 16px;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 100px;">
        <h1 class="mb-1" style="font-size: 1.8rem; font-weight: 600;">Habit Tracker</h1>
        <p class="text-muted mb-5">Build better habits, one day at a time.</p>

        <form action="/signup" method="POST">
            <div class="mb-3">
                <input type="email" name="email" placeholder="Email" class="form-control">
            </div>
            <div class="mb-4">
                <input type="password" name="password" placeholder="Password" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Create account</button>
        </form>

        <p class="mt-4 text-center" style="font-size:0.9rem; color:#6e6e73;">
            Already have an account? <a href="/login" style="color:#1d1d1f;">Log in</a>
        </p>
    </div>
</body>
</html>
